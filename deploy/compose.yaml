# Development: `podman compose -f deploy/compose.yaml up -d` starts the database, logs and metrics;
# the servers run from source. Deployment adds the shared account server and HTTPS proxy with
# `--profile deploy`, while each environment's game and web servers run from `deploy/compose.env.yaml`:
# see docs/deploy.md. Settings come from deploy/.env (deploy/env.example).
name: fetih

x-logging: &container-logging
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    container_name: fetih-db
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ../sql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  # Logs and metrics. Everything binds to loopback; Grafana is behind the proxy at /grafana/.
  loki:
    container_name: fetih-loki
    mem_limit: 384m
    environment:
      GOMEMLIMIT: 320MiB
    image: docker.io/grafana/loki:3.5.0
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  alloy:
    container_name: fetih-alloy
    mem_limit: 192m
    image: docker.io/grafana/alloy:v1.9.1
    restart: unless-stopped
    command: run --disable-reporting --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../src:/fetih/src:ro
      - logs:/fetih/logs:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  # Host metrics for the disk and memory alerts, and the backup job's textfile metrics
  node-exporter:
    profiles: [deploy]
    container_name: fetih-node-exporter
    mem_limit: 64m
    image: docker.io/prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - ${BACKUP_METRICS_DIR:-../observability/node-exporter/textfile}:/textfile:ro

  prometheus:
    container_name: fetih-prometheus
    mem_limit: 192m
    environment:
      GOMEMLIMIT: 160MiB
    image: docker.io/prom/prometheus:v3.4.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.containers.internal:host-gateway"

  grafana:
    container_name: fetih-grafana
    mem_limit: 192m
    image: docker.io/grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Webauth-User
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_AUTH_PROXY_SYNC_TTL: "60"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/overview.json
      GRAFANA_DISCORD_WEBHOOK: ${GRAFANA_DISCORD_WEBHOOK:-http://127.0.0.1:9/unconfigured}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      db: { condition: service_healthy }
      loki: { condition: service_started }
      prometheus: { condition: service_started }

  # Dev proxy so /grafana/ goes through Fetih.Web's /auth/check on the host, and a Windows VM
  # gets the web, patches and Fetih.exe (docs/launcher.md); hence not only on loopback
  dev-proxy:
    container_name: fetih-dev-proxy
    image: docker.io/library/caddy:2
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ${PATCH_PROD_DIR:-../_CLIENT/patch}:/srv/patch/prod:ro
      - ${PATCH_TEST_DIR:-../_CLIENT/patch}:/srv/patch/test:ro
      - ${DOWNLOAD_DIR:-../_CLIENT/patch/download}:/srv/download:ro
    extra_hosts:
      - "host.containers.internal:host-gateway"
    depends_on:
      - grafana

  # Deployment. Only the game, the account server and the proxy take outside connections;
  # the web, the game's RPC and metrics, and everything above stay on this network or on
  # the machine's loopback. Publishing ports keeps players' addresses only on rootful
  # Podman or Docker; rootless Podman shows every player as the same internal address.
  account:
    profiles: [deploy]
    container_name: fetih-account
    mem_limit: ${ACCOUNT_MEM_LIMIT:-256m}
    build: { context: .., dockerfile: deploy/Containerfile, target: account }
    restart: unless-stopped
    logging: *container-logging
    environment:
      FETIH_ACCOUNT_Database__Hostname: db
      FETIH_ACCOUNT_Database__Password: ${DB_PASSWORD:-password}
      FETIH_ACCOUNT_Metrics__IPAddress: 0.0.0.0
      FETIH_ACCOUNT_Logging__Directory: /logs/shared/account
      FETIH_ACCOUNT_Logging__Level: info
      FETIH_ACCOUNT_Logging__ConsoleLevel: warn
      FETIH_ACCOUNT_Logging__RetainDays: "14"
      FETIH_ACCOUNT_Logging__PacketTrace__All: "false"
    ports:
      - "9960:9960"
    volumes:
      - logs:/logs
    depends_on:
      db: { condition: service_healthy }

  proxy:
    profiles: [deploy]
    container_name: fetih-proxy
    image: docker.io/library/caddy:2
    restart: unless-stopped
    environment:
      FETIH_DOMAIN: ${FETIH_DOMAIN:-localhost}
      FETIH_TEST_DOMAIN: ${FETIH_TEST_DOMAIN:-test.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PATCH_PROD_DIR:-../_CLIENT/patch}:/srv/patch/prod:ro
      - ${PATCH_TEST_DIR:-../_CLIENT/patch}:/srv/patch/test:ro
      - ${DOWNLOAD_DIR:-../_CLIENT/patch/download}:/srv/download:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  default:
    name: fetih

volumes:
  logs:
    name: fetih-logs
  caddy-data:
  caddy-config:
  loki-data:
  alloy-data:
  prometheus-data:
  grafana-data:
