# Per-environment stack (game + web), run once per environment against the shared network
# and logs volume created by deploy/compose.yaml:
#   sudo podman compose -p fetih-prod -f deploy/compose.env.yaml --env-file /srv/fetih/prod.env up -d --build
#   sudo podman compose -p fetih-test -f deploy/compose.env.yaml --env-file /srv/fetih/test.env up -d --build

x-logging: &container-logging
  options:
    max-size: "10m"
    max-file: "3"

services:
  game:
    container_name: fetih-${FETIH_ENV:?set FETIH_ENV to prod or test}-game
    mem_limit: ${GAME_MEM_LIMIT:-2g}
    # The game saves everyone on SIGTERM; Saving:ShutdownSeconds must fit in this
    stop_grace_period: 30s
    build: { context: "${REPO_DIR:-..}", dockerfile: deploy/Containerfile, target: game }
    restart: unless-stopped
    logging: *container-logging
    networks:
      default:
        aliases:
          - fetih-${FETIH_ENV}-game
    environment:
      FETIH_GAME_Database__Hostname: db
      FETIH_GAME_Database__Schema: ${GAME_SCHEMA:-fetih_game}
      FETIH_GAME_Database__Password: ${DB_PASSWORD:-password}
      FETIH_GAME_AccountDatabase__Hostname: db
      FETIH_GAME_AccountDatabase__Password: ${DB_PASSWORD:-password}
      FETIH_GAME_RpcNetwork__IPAddress: 0.0.0.0
      FETIH_GAME_Metrics__IPAddress: 0.0.0.0
      FETIH_GAME_Maps__ClientDirectory: /client
      FETIH_GAME_Data__Directory: /data
      FETIH_GAME_Logging__Directory: /logs/${FETIH_ENV}/game
      FETIH_GAME_Logging__Level: info
      FETIH_GAME_Logging__ConsoleLevel: warn
      FETIH_GAME_Logging__RetainDays: ${LOG_RETAIN_DAYS:-14}
      FETIH_GAME_Logging__PacketTrace__All: "false"
    ports:
      - "${GAME_PORT:-5816}:5816"
    volumes:
      - ${CLIENT_DIR:-../_CLIENT/fetih}:/client:ro
      - ${DATA_DIR:-${REPO_DIR:-..}/src/Fetih.Game/Data}:/data:ro
      - logs:/logs

  # The checkout is mounted whole: Studio edits land in its Data directory, which the game
  # reads, and the Changes page diffs them with git
  web:
    container_name: fetih-${FETIH_ENV}-web
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    build: { context: "${REPO_DIR:-..}", dockerfile: deploy/Containerfile, target: web }
    restart: unless-stopped
    logging: *container-logging
    networks:
      default:
        aliases:
          - fetih-${FETIH_ENV}-web
    environment:
      FETIH_WEB_Database__Hostname: db
      FETIH_WEB_Database__Schema: ${GAME_SCHEMA:-fetih_game}
      FETIH_WEB_Database__Password: ${DB_PASSWORD:-password}
      FETIH_WEB_AccountDatabase__Hostname: db
      FETIH_WEB_AccountDatabase__Password: ${DB_PASSWORD:-password}
      FETIH_WEB_Web__Urls: http://0.0.0.0:5820
      FETIH_WEB_Web__SecureCookies: "true"
      FETIH_WEB_Web__ClientDownloadUrl: /download/Fetih.exe
      FETIH_WEB_Web__ForwardedHeaders: "true"
      FETIH_WEB_Web__StaffOnly: ${STAFF_ONLY:-false}
      FETIH_WEB_Web__StudioReadOnly: ${STUDIO_READ_ONLY:-false}
      FETIH_WEB_GameRpc__Hostname: fetih-${FETIH_ENV}-game
      FETIH_WEB_Observability__Environment: ${FETIH_ENV}
      FETIH_WEB_Paths__DataDirectory: /repo/src/Fetih.Game/Data
      FETIH_WEB_Paths__ClientDirectory: /client
      FETIH_WEB_Paths__AssetsDirectory: /assets
      FETIH_WEB_Logging__Directory: /logs/${FETIH_ENV}/web
      FETIH_WEB_Logging__ConsoleLevel: warn
      FETIH_WEB_Logging__RetainDays: ${LOG_RETAIN_DAYS:-14}
    volumes:
      - ${REPO_DIR:-..}:/repo
      - ${CLIENT_DIR:-../_CLIENT/fetih}:/client:ro
      - ${ASSETS_DIR:-../web/assets}:/assets:ro
      - logs:/logs
      # The keys that sign login cookies; without them every update logs everyone out
      - web-keys:/root/.aspnet/DataProtection-Keys

networks:
  default:
    name: fetih
    external: true

volumes:
  logs:
    name: fetih-logs
    external: true
  web-keys:
