# Local development: starts MariaDB (127.0.0.1:3306) and optional dev-proxy (:8080 for VM launcher testing).
#   podman compose -f deploy/dev.yaml up -d db
name: fetih

services:
  db:
    container_name: fetih-db
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ../sql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  dev-proxy:
    container_name: fetih-dev-proxy
    image: docker.io/library/caddy:2
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ../_CLIENT/patch:/srv/patch:ro
      - ../_CLIENT/patch/download:/srv/download:ro
    extra_hosts:
      - "host.containers.internal:host-gateway"
