# Development: `podman compose up -d` starts the database, logs and metrics; the servers run
# from source. Deployment adds the servers and the HTTPS proxy with `--profile deploy`: see
# docs/deploy.md. Settings come from .env (deploy/env.example).
name: fetih

services:
  db:
    container_name: fetih-db
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./comet/sql/data:/var/lib/mysql
      # Auto-seed schemas on first run
      - ./comet/sql/comet.account.sql:/docker-entrypoint-initdb.d/01-account.sql:ro
      - ./comet/sql/comet.game.sql:/docker-entrypoint-initdb.d/02-game.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  # Logs and metrics. Everything binds to loopback; Grafana is http://localhost:3000
  loki:
    container_name: fetih-loki
    mem_limit: 384m
    environment:
      GOMEMLIMIT: 320MiB
    image: docker.io/grafana/loki:3.5.0
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  alloy:
    container_name: fetih-alloy
    mem_limit: 192m
    image: docker.io/grafana/alloy:v1.9.1
    restart: unless-stopped
    command: run --disable-reporting --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./comet/src:/comet/src:ro
      - logs:/comet/logs:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  prometheus:
    container_name: fetih-prometheus
    mem_limit: 192m
    environment:
      GOMEMLIMIT: 160MiB
    image: docker.io/prom/prometheus:v3.4.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.containers.internal:host-gateway"

  grafana:
    container_name: fetih-grafana
    mem_limit: 192m
    image: docker.io/grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Viewers need no login: Grafana is only reachable from this machine, and the web
      # links and embeds its panels
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/overview.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

  # Deployment. Only the game, the account server and the proxy take outside connections;
  # the web, the game's RPC and metrics, and everything above stay on this network or on
  # the machine's loopback. Publishing ports keeps players' addresses only on rootful
  # Podman or Docker; rootless Podman shows every player as the same internal address.
  account:
    profiles: [deploy]
    container_name: fetih-account
    build: { context: ., dockerfile: Containerfile, target: account }
    restart: unless-stopped
    environment:
      COMET_ACCOUNT_Database__Hostname: db
      COMET_ACCOUNT_Database__Password: ${DB_PASSWORD:-password}
      COMET_ACCOUNT_Logging__Directory: /logs/account
    ports:
      - "9960:9960"
    volumes:
      - logs:/logs
    depends_on:
      db: { condition: service_healthy }

  game:
    profiles: [deploy]
    container_name: fetih-game
    build: { context: ., dockerfile: Containerfile, target: game }
    restart: unless-stopped
    environment:
      COMET_GAME_Database__Hostname: db
      COMET_GAME_Database__Password: ${DB_PASSWORD:-password}
      COMET_GAME_AccountDatabase__Hostname: db
      COMET_GAME_AccountDatabase__Password: ${DB_PASSWORD:-password}
      COMET_GAME_RpcNetwork__IPAddress: 0.0.0.0
      COMET_GAME_Metrics__IPAddress: 0.0.0.0
      COMET_GAME_Maps__ClientDirectory: /client
      COMET_GAME_Data__Directory: /data
      COMET_GAME_Logging__Directory: /logs/game
    ports:
      - "5816:5816"
    volumes:
      - ${CLIENT_DIR:-./_CLIENT/fetih}:/client:ro
      - ./comet/src/Comet.Game/Data:/data:ro
      - logs:/logs
    depends_on:
      db: { condition: service_healthy }

  # The checkout is mounted whole: Studio edits land in its Data directory, which the game
  # reads, and the Changes page diffs them with git
  web:
    profiles: [deploy]
    container_name: fetih-web
    build: { context: ., dockerfile: Containerfile, target: web }
    restart: unless-stopped
    environment:
      COMET_WEB_Database__Hostname: db
      COMET_WEB_Database__Password: ${DB_PASSWORD:-password}
      COMET_WEB_AccountDatabase__Hostname: db
      COMET_WEB_AccountDatabase__Password: ${DB_PASSWORD:-password}
      COMET_WEB_Web__Urls: http://0.0.0.0:5820
      COMET_WEB_Web__SecureCookies: "true"
      COMET_WEB_Web__ForwardedHeaders: "true"
      COMET_WEB_GameRpc__Hostname: game
      COMET_WEB_Observability__LokiUrl: http://loki:3100
      COMET_WEB_Paths__DataDirectory: /repo/comet/src/Comet.Game/Data
      COMET_WEB_Paths__ClientDirectory: /client
      COMET_WEB_Paths__AssetsDirectory: /assets
      COMET_WEB_Paths__FrontendDirectory: /app/wwwroot
      COMET_WEB_Logging__Directory: /logs/web
    volumes:
      - .:/repo
      - ${CLIENT_DIR:-./_CLIENT/fetih}:/client:ro
      - ./web/assets:/assets:ro
      - logs:/logs
      # The keys that sign login cookies; without them every update logs everyone out
      - web-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      db: { condition: service_healthy }

  proxy:
    profiles: [deploy]
    container_name: fetih-proxy
    image: docker.io/library/caddy:2
    restart: unless-stopped
    environment:
      FETIH_DOMAIN: ${FETIH_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  logs:
  web-keys:
  caddy-data:
  caddy-config:
  loki-data:
  alloy-data:
  prometheus-data:
  grafana-data:
