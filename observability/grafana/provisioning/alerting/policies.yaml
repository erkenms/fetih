apiVersion: 1

policies:
  - orgId: 1
    receiver: discord
    group_by:
      - alertname
      - env
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: discord
        object_matchers:
          - [category, =, event]
        group_wait: 15s
        group_interval: 1m
        repeat_interval: 24h
      - receiver: discord
        object_matchers:
          - [severity, =, critical]
        group_wait: 15s
        group_interval: 5m
        repeat_interval: 1h
      - receiver: discord
        object_matchers:
          - [category, =, logs]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h
