global:
  scrape_interval: 15s

scrape_configs:
  - job_name: game
    static_configs:
      - targets: ["fetih-prod-game:9818"]
        labels:
          server: game
          env: prod
      - targets: ["fetih-test-game:9818"]
        labels:
          server: game
          env: test
      - targets: ["host.containers.internal:9818"]
        labels:
          server: game
          env: dev
