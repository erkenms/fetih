auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 2160h
  retention_stream:
    - selector: '{env="test"}'
      priority: 100
      period: 168h
    - selector: '{event=~"trade\\..+|booth\\.sold|gm\\..+|web\\..+|character\\.deleted|session\\.cheat_report|pk\\.jailed|account\\.created"}'
      priority: 50
      period: 87600h
    - selector: '{event=~"session\\..+|account\\.login.*"}'
      priority: 40
      period: 17520h
    - selector: '{event=~"(move|combat|monster)\\..+"}'
      priority: 20
      period: 168h
    - selector: '{event=~"packet\\..+"}'
      priority: 10
      period: 48h
  # Dev servers keep 30 days of logs; Alloy sends all of them on its first run
  reject_old_samples_max_age: 720h
  # Low enough that the first run's backfill doesn't starve a small podman VM
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 4MB
  per_stream_rate_limit_burst: 8MB
  max_query_series: 5000
  allow_structured_metadata: true
  # Only server, level and event are labels
  discover_service_name: []
  discover_log_levels: false

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
